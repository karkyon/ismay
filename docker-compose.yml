name: ismay

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ismay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ismay
      POSTGRES_PASSWORD: ismay_dev_password
      POSTGRES_DB: ismay_dev
    # [SECURITY-RATE-02D] host側はloopbackだけに公開する(LANからはSSHトンネル: ssh -L 15432:127.0.0.1:15432)。
    # Dockerが公開したportはufw等の規則を迂回するため、bind addressで限定する
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ismay -d ismay_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ismay-net

  redis:
    image: redis:7-alpine
    container_name: ismay-redis
    restart: unless-stopped
    # [SECURITY-RATE-02C] rate limitのbucketを保持する。host側はloopbackだけに公開する
    # (Dockerが公開したportはufw等の規則を迂回するため、bind addressで限定する)
    # [SECURITY-RATE-02D] 認証必須。REDIS_PASSWORDはrepository直下の.env(gitignore対象、mode 600)に置き、
    # app/.envのREDIS_URLは redis://:<REDIS_PASSWORD>@localhost:16379 とする。未設定ならcomposeが起動を拒否する
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required in the repository root .env (docs/runbooks/SECURITY_RATE_RUNBOOK.md)}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - ./docker-data/redis:/data
    healthcheck:
      # REDISCLI_AUTH(環境変数)で認証する(passwordをcommand lineへ出さない)
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ismay-net

  minio:
    image: minio/minio:latest
    container_name: ismay-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ismay_minio
      MINIO_ROOT_PASSWORD: ismay_minio_password
    # [SECURITY-RATE-02D] appはserver側からlocalhost:19000で接続し、browserへMinIOのURLを渡さないためloopbackで足りる。
    # 管理コンソールはSSHトンネル(ssh -L 19001:127.0.0.1:19001)で使う
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - ./docker-data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ismay-net

networks:
  ismay-net:
    name: ismay-net
    driver: bridge
